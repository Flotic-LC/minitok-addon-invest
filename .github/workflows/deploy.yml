name: Deploy minitok addon

on:
  push:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build admin image
        run: docker build -f Dockerfile.admin -t minitok-admin:${{ github.sha }} .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: minitok-admin:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Save image
        run: docker save minitok-admin:${{ github.sha }} | gzip > admin-image.tar.gz

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "admin-image.tar.gz,runner.js,Dockerfile,.dockerignore,package.json,package-lock.json,docker-compose.production.yml,minitok.yml,goals.json,universe.json,src/"
          target: "/opt/minitok/addons/invest/"

      - name: Restart containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/minitok/addons/invest
            docker load < admin-image.tar.gz
            # The runner runs from its image, so the source that was just
            # copied has to be built into it. `docker compose up --no-build`
            # would keep the previous image and the new code would never
            # run — the container would come back on the old code. deploy.sh
            # rebuilds, recreates and health-checks in one step.
            bash scripts/deploy.sh
            docker compose -f docker-compose.production.yml up -d --no-build invest-admin
            rm -f admin-image.tar.gz
