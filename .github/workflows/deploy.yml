name: Deploy minitok addon

on:
  push:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build admin image
        run: docker build -f Dockerfile.admin -t minitok-admin:${{ github.sha }} .

      - name: Save image
        run: docker save minitok-admin:${{ github.sha }} | gzip > admin-image.tar.gz

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "admin-image.tar.gz,runner.js,docker-compose.production.yml,minitok.yml,src/"
          target: "/opt/minitok/addons/invest/"

      - name: Restart containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/minitok/addons/invest
            docker load < admin-image.tar.gz
            docker compose -f docker-compose.production.yml up -d --no-build invest-bot invest-admin
            rm -f admin-image.tar.gz
